name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Fresh Android Files
        run: |
          mkdir temp_backup
          cp -r lib temp_backup/
          cp pubspec.yaml temp_backup/
          rm -rf lib pubspec.yaml
          flutter create . --project-name pos_app --platforms=android --org com.zadit.pos
          cp -rf temp_backup/lib/* lib/
          cp temp_backup/pubspec.yaml pubspec.yaml
          rm -rf temp_backup

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
